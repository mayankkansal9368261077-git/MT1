<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library Management System</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Library Management System</a>
    <nav><a href="/">All books</a></nav>
  </header>
  <main class="layout">
    <section class="panel">
      <h1>Books</h1>
      <p class="muted">Browse the collection or select a book to see its details.</p>
      <p id="status" class="status" role="status"></p>
      <div id="book-list" class="book-list"></div>
    </section>
    <section class="panel">
      <h2>Add a book</h2>
      <form id="book-form">
        <label>Title <input name="title" required maxlength="200"></label>
        <label>Author <input name="author" required maxlength="200"></label>
        <label>Category <input name="category" required maxlength="100"></label>
        <button type="submit">Add book</button>
      </form>
    </section>
  </main>
  <script src="/script.js" defer></script>
</body>
</html>
